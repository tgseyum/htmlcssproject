<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        div {
            border: solid green 3px;
        }

        .box {
            padding-left: 20px;
            padding-top: 20px;
            margin: 20px 10px 14px 20px;
            width: 100px;
            height: 100px;
            background-color: red;
            border-left: solid rgb(53, 0, 128) 2px;
            border-right: solid rgb(13, 128, 0) 3px;
            border-left: dotted rgb(98, 27, 197) 4px;
            border-radius: 15px 25px;
        }

        .container {
            /* padding: 20px; */
            margin: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            Box1
        </div>
    </div>
</body>

</html>
