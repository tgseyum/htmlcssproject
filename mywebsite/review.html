<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        div{
            height: 100px;
            width: 100px;
            border: solid red 2px;
            border-top: solid green 1px;
            margin: 20px;
            padding-left:20px ;
        }
        span{
            display: none;
            width: 200px;
            border: solid blue 2px;
            margin: 15px;
        }
        .box2{
            position: absolute;
            left: 20px;
            background-color: gray;
            
        }
    </style>
</head>
<body>
    <section>
        <div>box1</div>
        <span>Span element</span>
        <a href="">Link</a>

    </section>
    <section>
        <div class="box2">Box 2</div>
         <div class="box3">Box 3</div>
    </section>
</body>
</html>
