<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        div{
            width: 200px;
            height: 200px;
        }
        .box{
        
            border: solid red 1px;
            position:absolute;
            top:100px;
            left:100px;
            background-color: green;
            z-index: 1;
        }
        .div2{
            background-color: gray ;
            position:static;
            z-index: 2;
        }
    </style>
</head>
<body>
    <section style="border: solid 2px blue; margin: 20px;">
        <div class="box">  Div 1  </div>
        <div class="div2">Div 2</div>
    </section>
   
</body>
</html>
